services:
  license-api:
    build:
      context: ./license-server
    container_name: avina-license-api
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /data
      LICENSE_ADMIN_TOKEN: ${LICENSE_ADMIN_TOKEN:?Set LICENSE_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - avina_license_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  avina_license_data:
